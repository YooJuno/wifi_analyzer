name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version (for example, 1.1.0 or 1.1.0-rc.1)
        required: false
        default: "0.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: '1'

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WIFI_ANALYZER_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version || '0.0.0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: macos-15-intel
            artifact: macos-universal2
          - os: windows-2025
            artifact: windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        if: runner.os != 'macOS'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Set up universal2 Python on macOS
        if: runner.os == 'macOS'
        run: bash tools/setup_macos_ci.sh

      - name: Validate package version
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          value = os.environ['WIFI_ANALYZER_VERSION']
          if not re.fullmatch(r'v?\d+\.\d+\.\d+(?:-rc\.[1-9]\d*)?', value):
              raise SystemExit('Version must be X.Y.Z or X.Y.Z-rc.N, optionally prefixed with v')
          PY

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb xauth fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install --upgrade --requirement requirements.txt --requirement requirements-build.txt

      - name: Validate source
        run: |
          python -m compileall -q wifi_gui.py wifi_scan.py diagnostics.py measurement_log.py wifi_core.py wifi_platform.py platforms tests tools
          python -c "import tkinter, wifi_gui; print('GUI imports: OK')"
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build standalone application
        env:
          WIFI_MAC_UNIVERSAL: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: python -m PyInstaller --clean --noconfirm wifi_analyzer.spec

      - name: Verify GUI and logs without Wi-Fi access
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/verify_gui.py

      - name: Render GUI with synthetic networks without scanning
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python tools/capture_preview.py --output build/previews

      - name: Upload GUI previews
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: WiFiAnalyzer-previews
          path: build/previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/WiFiAnalyzer.app
          python tools/verify_macos_bundle.py

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf release/WiFiAnalyzer-linux-x86_64.tar.gz WiFiAnalyzer

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/WiFiAnalyzer.app release/WiFiAnalyzer-macOS-universal2.zip

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist\WiFiAnalyzer -DestinationPath release\WiFiAnalyzer-Windows-x86_64.zip

      - name: Write SHA-256 checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          for path in pathlib.Path('release').iterdir():
              if path.is_file() and not path.name.endswith('.sha256'):
                  with path.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  path.with_name(path.name + '.sha256').write_text(digest + '  ' + path.name + '\n', encoding='utf-8')
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: WiFiAnalyzer-package-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: WiFiAnalyzer-package-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ${{ contains(github.ref_name, '-') && '검증용 사전 배포본입니다. Windows/Linux의 실제 무선 장치·드라이버 최종 검증은 남아 있습니다.' || '' }}

            포함 패키지: Windows x86_64, Ubuntu/Linux x86_64, macOS universal2 (Apple Silicon·Intel).
            각 압축 파일과 함께 SHA-256 체크섬을 제공합니다.

            macOS 앱은 ad-hoc 서명, Windows 실행 파일은 무서명입니다.
            설치·측정 기능과 플랫폼별 수집 제약은 README.md, 최종 검증 절차는 BUILDING.md를 확인하세요.
          fail_on_unmatched_files: true
          files: release/*

