name: Continuous integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
          - name: macOS Intel
            os: macos-15-intel
          - name: Windows x86_64
            os: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux Tk support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb xauth fonts-noto-cjk

      - name: Install runtime dependencies
        run: python -m pip install --upgrade --requirement requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q wifi_gui.py wifi_scan.py diagnostics.py measurement_log.py wifi_core.py wifi_platform.py platforms tests tools

      - name: Smoke-test GUI imports
        run: |
          python -c "import tkinter, wifi_gui; print('GUI imports OK')"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify GUI and logs without Wi-Fi access
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/verify_gui.py
